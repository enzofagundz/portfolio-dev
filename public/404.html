<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Enzo Fagundes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --navy: #0c2764;
        --ink: #0f172b;
        --muted: #45556c;
        --mist: #62748e;
        --line: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      main {
        margin: 0 auto;
        width: 100%;
        max-width: 75rem;
        padding: clamp(4rem, 12vw, 9rem) clamp(1.25rem, 4vw, 2.5rem);
      }
      .label {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mist);
      }
      h1 {
        margin: 1rem 0 0;
        font-size: clamp(1.75rem, 3.4vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: var(--navy);
        text-wrap: balance;
      }
      p {
        margin: 1.25rem 0 0;
        max-width: 36rem;
        font-size: 1.125rem;
        color: var(--muted);
        text-wrap: pretty;
      }
      a.back {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        margin-top: 2.25rem;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        background: var(--navy);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        text-decoration: none;
      }
      a.back:hover {
        background: #091e4d;
      }
      a.back:focus-visible {
        outline: 2px solid var(--navy);
        outline-offset: 3px;
      }
      hr {
        margin: 3.5rem 0 1.5rem;
        border: 0;
        border-top: 1px solid var(--line);
      }
      footer {
        font-size: 0.875rem;
        color: var(--mist);
      }
      footer a {
        color: var(--ink);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Erro 404</p>
      <h1>Esta página não existe.</h1>
      <p>
        O endereço que você abriu não está no site. Você pode voltar para o início ou falar comigo diretamente pelo
        WhatsApp ou por e-mail, na página de contato.
      </p>
      <a class="back" href="/">Voltar para o início</a>
      <hr />
      <footer>Enzo Fagundes — Desenvolvimento web para profissionais e negócios.</footer>
    </main>
  </body>
</html>
